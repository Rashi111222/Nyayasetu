 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyaya Setu AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .navbar { background: #1a3a5c !important; }
        .card { border-radius: 10px; }
        .btn-approve { background: #10b981; color: white; border: none; }
        .btn-approve:hover { background: #059669; color: white; }
        .btn-reject { background: #ef4444; color: white; border: none; }
        .btn-reject:hover { background: #dc2626; color: white; }
    </style>
</head>
<body>

    {% if user.is_authenticated %}
    <nav class="navbar navbar-dark px-4 py-2">
        <span class="navbar-brand fw-bold fs-5">⚖️ Nyaya Setu AI</span>
        <div>
            <a href="{% url 'dashboard' %}" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
            <a href="{% url 'upload' %}" class="btn btn-warning btn-sm me-2">Upload Judgment</a>
            <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </nav>
    {% endif %}

    <div class="container mt-4">
        {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
